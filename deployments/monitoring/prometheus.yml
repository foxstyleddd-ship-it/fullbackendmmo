global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'hp-mmo-dev'
    environment: 'development'

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'api-server'
    static_configs:
      - targets: ['host.docker.internal:9091']
    metrics_path: /metrics

  - job_name: 'zone-server'
    static_configs:
      - targets: ['host.docker.internal:9092']
    metrics_path: /metrics

  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']

  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
